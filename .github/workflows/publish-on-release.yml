name: 💡 | Publish

on:
  release:
    types:
      - created

env:
  PROJECT_NAME: sshhub
  PUBLISH_TRIMMED: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        runtime:
          - win-x64
          - win-x86
          - win-arm64
          - linux-x64
          - linux-arm
          - linux-arm64
          - osx-x64
          - osx-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Ensure zip is installed
        shell: bash
        run: |
          set -e
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zip
          fi

      - name: Restore
        run: dotnet restore

      - name: Publish
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -e

          echo "=== Publishing $PROJECT_NAME for $RUNTIME ==="

          pushd "$PROJECT_NAME" >/dev/null

          rm -rf bin
          mkdir -p bin

          if [[ "$RUNTIME" != osx-* ]]; then
            extra_flags="-p:PublishReadyToRun=true"
          else
            extra_flags=""
          fi

          dotnet publish -c Release -r "$RUNTIME" -f net10.0 \
            --self-contained true \
            -p:PublishTrimmed="$PUBLISH_TRIMMED" \
            -p:AssemblyName="$PROJECT_NAME" \
            -p:PublishSingleFile=true \
            $extra_flags \
            -p:PublishDir=bin

          echo "--- bin contents ($RUNTIME) ---"
          ls -la bin

          if [ -z "$(ls -A bin)" ]; then
            echo "bin is empty for $RUNTIME"
            exit 1
          fi

          rm -rd bin/Release/

          cd bin
          zip -r "../../${PROJECT_NAME}_${RUNTIME}.zip" .

          popd >/dev/null

          echo "--- Published artifact ---"
          ls -lh "${PROJECT_NAME}_${RUNTIME}.zip"

      - name: Upload asset to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_NAME }}_${{ matrix.runtime }}.zip
